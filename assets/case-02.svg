<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330"><rect width="620" height="330" fill="#f5f0e1"/><rect x="24" y="24" width="580" height="290" fill="#111"/><rect x="14" y="14" width="580" height="290" fill="#fff" stroke="#111" stroke-width="5"/><rect x="14" y="14" width="580" height="72" fill="#7cf2d4" stroke="#111" stroke-width="5"/><text x="34" y="68" font-family="Impact,Arial Black,sans-serif" font-size="54" fill="#111" text-anchor="start" >#02</text><text x="574" y="62" font-family="Courier New,monospace" font-size="24" fill="#111" text-anchor="end" font-weight="700">jev compact</text><text x="34" y="140" font-family="Impact,Arial Black,sans-serif" font-size="38" fill="#111" text-anchor="start" >BUILD LOG COMPACTOR</text><text x="34" y="184" font-family="Courier New,monospace" font-size="21" fill="#111" text-anchor="start" font-weight="700">Runs a command, hands the agent only</text><text x="34" y="212" font-family="Courier New,monospace" font-size="21" fill="#111" text-anchor="start" font-weight="700">the lines that matter.</text><rect x="34" y="240" width="540" height="46" fill="#111"/><text x="48" y="271" font-family="Courier New,monospace" font-size="20" fill="#ffe14d" text-anchor="start" font-weight="700">31 lines  -&gt;  17, every error kept</text></svg>