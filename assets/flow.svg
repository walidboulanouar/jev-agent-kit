<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420"><rect width="1280" height="420" fill="#f5f0e1"/><text x="40" y="70" font-family="Impact,Arial Black,sans-serif" font-size="44" fill="#111" text-anchor="start" >HOW IT FITS IN AN AGENT LOOP</text><rect x="50" y="130" width="250" height="190" fill="#111"/><rect x="40" y="120" width="250" height="190" fill="#7cc4ff" stroke="#111" stroke-width="5"/><text x="165" y="190" font-family="Impact,Arial Black,sans-serif" font-size="40" fill="#111" text-anchor="middle" >TEXT</text><text x="165" y="235" font-family="Courier New,monospace" font-size="20" fill="#111" text-anchor="middle" font-weight="700">log, diff, email,</text><text x="165" y="263" font-family="Courier New,monospace" font-size="20" fill="#111" text-anchor="middle" font-weight="700">command</text><polygon points="310,200 350,200 350,180 385,215 350,250 350,230 310,230" fill="#111"/><rect x="370" y="130" width="250" height="190" fill="#111"/><rect x="360" y="120" width="250" height="190" fill="#ffe14d" stroke="#111" stroke-width="5"/><text x="485" y="190" font-family="Impact,Arial Black,sans-serif" font-size="40" fill="#111" text-anchor="middle" >JEV</text><text x="485" y="235" font-family="Courier New,monospace" font-size="20" fill="#111" text-anchor="middle" font-weight="700">one question,</text><text x="485" y="263" font-family="Courier New,monospace" font-size="20" fill="#111" text-anchor="middle" font-weight="700">many items</text><polygon points="630,200 670,200 670,180 705,215 670,250 670,230 630,230" fill="#111"/><rect x="690" y="130" width="250" height="190" fill="#111"/><rect x="680" y="120" width="250" height="190" fill="#ff8fb8" stroke="#111" stroke-width="5"/><text x="805" y="190" font-family="Impact,Arial Black,sans-serif" font-size="40" fill="#111" text-anchor="middle" >NUMBER</text><text x="805" y="235" font-family="Courier New,monospace" font-size="20" fill="#111" text-anchor="middle" font-weight="700">probability, pick</text><text x="805" y="263" font-family="Courier New,monospace" font-size="20" fill="#111" text-anchor="middle" font-weight="700">or score</text><polygon points="950,200 990,200 990,180 1025,215 990,250 990,230 950,230" fill="#111"/><rect x="1010" y="130" width="250" height="190" fill="#111"/><rect x="1000" y="120" width="250" height="190" fill="#b9f27c" stroke="#111" stroke-width="5"/><text x="1125" y="190" font-family="Impact,Arial Black,sans-serif" font-size="40" fill="#111" text-anchor="middle" >YOUR CODE</text><text x="1125" y="235" font-family="Courier New,monospace" font-size="20" fill="#111" text-anchor="middle" font-weight="700">branches on it:</text><text x="1125" y="263" font-family="Courier New,monospace" font-size="20" fill="#111" text-anchor="middle" font-weight="700">allow, ask, route</text><text x="40" y="380" font-family="Courier New,monospace" font-size="22" fill="#111" text-anchor="start" font-weight="700">The model never writes text. It answers with a number, and your code decides what happens next.</text></svg>