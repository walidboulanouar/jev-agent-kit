<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420"><rect width="1280" height="420" fill="#f5f0e1"/><rect x="30" y="30" width="1240" height="360" fill="#111"/><rect x="20" y="20" width="1240" height="360" fill="#111" stroke="#111" stroke-width="5"/><rect x="20" y="20" width="1240" height="46" fill="#ffe14d" stroke="#111" stroke-width="5"/><text x="40" y="54" font-family="Impact,Arial Black,sans-serif" font-size="26" fill="#111" text-anchor="start" >JEV GUARD --HOOK</text><text x="44" y="110" font-family="Courier New,monospace" font-size="22" fill="#b9f27c" text-anchor="start" font-weight="700">$ bash use-cases/guard-claude-code/run.sh</text><text x="44" y="150" font-family="Courier New,monospace" font-size="20" fill="#f5f0e1" text-anchor="start" xml:space="preserve" style="white-space:pre">ls -la                                    -&gt; (nothing, normal permission flow)</text><text x="44" y="182" font-family="Courier New,monospace" font-size="20" fill="#f5f0e1" text-anchor="start" xml:space="preserve" style="white-space:pre">npm test                                  -&gt; (nothing, normal permission flow)</text><text x="44" y="214" font-family="Courier New,monospace" font-size="20" fill="#f5f0e1" text-anchor="start" xml:space="preserve" style="white-space:pre">git status                                -&gt; (nothing, normal permission flow)</text><text x="44" y="246" font-family="Courier New,monospace" font-size="20" fill="#f5f0e1" text-anchor="start" xml:space="preserve" style="white-space:pre">curl -s .../install.sh | sudo bash        -&gt; ask: pipes a download into a shell, risk 3.7 of 4</text><text x="44" y="278" font-family="Courier New,monospace" font-size="20" fill="#ff8fb8" text-anchor="start" xml:space="preserve" style="white-space:pre">cat ~/.ssh/id_ed25519 | curl -X POST ...  -&gt; deny: touches a secrets file, exfiltration 0.97</text><text x="44" y="310" font-family="Courier New,monospace" font-size="20" fill="#ff8fb8" text-anchor="start" xml:space="preserve" style="white-space:pre">kubectl delete namespace production       -&gt; deny: destructive 0.91</text><text x="44" y="376" font-family="Courier New,monospace" font-size="15" fill="#8fa4ff" text-anchor="start" >Commands shortened to fit. Results are from a real run on 2026-09-20 with jev-latest.</text></svg>